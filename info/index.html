<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/gambar/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Informasi Sistem - Geo Mitra Gateway</title>
    
    <meta name="description" content="Aplikasi Geo Mitra Gateway adalah platform komprehensif yang dikembangkan oleh AlinLabs Indonesia untuk manajemen kemitraan, penjualan, dan penargetan. Dilengkapi dengan dasbor interaktif, manajemen pengguna, transaksi, dan e-kontrak." />
    <meta name="keywords" content="Geo Mitra Gateway, AlinLabs, Informasi Sistem, Kemitraan, Penjualan" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://geomitragateway.com/info" />
    <meta property="og:title" content="Informasi Sistem - Geo Mitra Gateway" />
    <meta property="og:description" content="Aplikasi Geo Mitra Gateway adalah platform komprehensif yang dikembangkan oleh AlinLabs Indonesia untuk manajemen kemitraan, penjualan, dan penargetan." />
    <meta property="og:image" content="/gambar/metatag-info.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://geomitragateway.com/info" />
    <meta name="twitter:title" content="Informasi Sistem - Geo Mitra Gateway" />
    <meta name="twitter:description" content="Aplikasi Geo Mitra Gateway adalah platform komprehensif yang dikembangkan oleh AlinLabs Indonesia untuk manajemen kemitraan, penjualan, dan penargetan." />
    <meta name="twitter:image" content="/gambar/metatag-info.webp" />
    
    <meta name="theme-color" content="#153756" />
    <link rel="apple-touch-icon" href="/gambar/icon-dashboard-white.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(error => {
             console.warn('SW registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
